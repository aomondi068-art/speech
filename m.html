<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Diplomatic Reception Room</title>
    <style>
        :root {
            --presidential-blue: #0b1d3a;
            --accent-gold: #e5a93b;
            --carpet-red: #8b0000;
            --card-bg: #152642;
            --text-light: #f4f6f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: var(--presidential-blue);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .workspace {
            display: flex;
            width: 100%;
            max-width: 1100px;
            height: 600px;
            background-color: var(--card-bg);
            border: 4px solid var(--accent-gold);
            border-radius: 4px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Left Control Panel */
        .panel-control {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px solid var(--accent-gold);
            background: linear-gradient(180deg, rgba(11,29,58,0.5) 0%, rgba(11,29,58,0.9) 100%);
        }

        .header-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-area h1 {
            font-size: 2.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header-area p {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a0aec0;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #718096;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--carpet-red);
            color: white;
            border: 1px solid var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background-color: #b30000;
        }

        /* Right Teleprompter Panel */
        .panel-prompter {
            flex: 1.2;
            background-color: #050b14;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .prompter-glass {
            flex-grow: 1;
            border: 2px solid rgba(229, 169, 59, 0.2);
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .prompter-glass::-webkit-scrollbar {
            width: 4px;
        }
        .prompter-glass::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
        }

        .scrolling-text {
            font-size: 1.6rem;
            line-height: 1.8;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            text-align: left;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            color: #718096;
            text-transform: uppercase;
        }

        .live-indicator {
            color: #ff3333;
            font-weight: bold;
            display: none;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        <!-- Left Panel: Form Entry -->
        <div class="panel-control">
            <div class="header-area">
                <h1>The East Room</h1>
                <p>Official Guest Arrival</p>
            </div>
            
            <div class="input-wrapper">
                <input type="text" id="visitorName" placeholder="Enter Dignitary Name" autocomplete="off">
            </div>
            
            <button class="action-btn" onclick="initiatePressBriefing()">Announce Arrival</button>
        </div>

        <!-- Right Panel: Teleprompter Monitor -->
        <div class="panel-prompter">
            <div class="prompter-glass">
                <div class="scrolling-text" id="prompterOutput">
                    AWAITING DIGNITARY ARRIVAL...<br><br>
                    READY SYSTEM INDICATION ONE.
                </div>
            </div>
            
            <div class="status-bar">
                <span>Mode: Broadcast Welcome</span>
                <span class="live-indicator" id="liveTag">● LIVE SPEED</span>
            </div>
        </div>
    </div>

    <script>
        const briefingTemplates = [
            "BREAKING NEWS... I am standing here with [NAME]. A total winner. What they have done is historic, nobody has ever seen anything like it before. We want to welcome them to this beautiful room. Great genes, great person!",
            "Distinguished guests, we have the great [NAME] with us today. Very smart, highly successful. The fake news said they wouldn't make it, but they are here, winning bigger than ever. Welcome, it is an absolute privilege.",
            "My administration is incredibly glad to welcome [NAME] to Washington. We just had a meeting, a fantastic meeting, the best meeting. [NAME] is going to do big things with us. Welcome, welcome, welcome!"
        ];

        function initiatePressBriefing() {
            const guestName = document.getElementById('visitorName').value.trim();
            const output = document.getElementById('prompterOutput');
            const liveTag = document.getElementById('liveTag');

            if (!guestName) {
                output.innerHTML = "SYSTEM ERROR:<br>PLEASE CHOOSE A VALID NAME FOR THE DELEGATION CARD.";
                liveTag.style.display = "none";
                return;
            }

            const selection = Math.floor(Math.random() * briefingTemplates.length);
            const rawSpeech = briefingTemplates[selection];
            const dynamicSpeech = rawSpeech.replace(/\[NAME\]/g, guestName.toUpperCase());

            // Render text onto the prompter display
            output.innerHTML = dynamicSpeech;
            liveTag.style.display = "inline";

            // Trigger the browser's speech synthesis engine
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speechTrack = new SpeechSynthesisUtterance(dynamicSpeech.replace("BREAKING NEWS...", ""));
                speechTrack.rate = 0.88;
                speechTrack.pitch = 0.95;
                window.speechSynthesis.speak(speechTrack);
            }
        }

        // Trigger on enter key
        document.getElementById('visitorName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                initiatePressBriefing();
            }
        });
    </script>
</body>
</html>
